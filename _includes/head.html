<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
    (function () {
        try {
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.classList.add('dark-theme');
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.documentElement.classList.remove('dark-theme');
            }
        } catch (e) {}
    })();
</script>
<title>{% if page.title %}{{ page.title }} | Sumit Sengar{% else %}Sumit Sengar | Expressing the Unspoken Words{% endif %}</title>

<meta name="author" content="Sumit Sengar">
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | Sumit Sengar{% else %}Sumit Sengar | Expressing the Unspoken Words{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:site_name" content="Sumit Sengar">
<meta property="og:locale" content="en_US">
{% if page.layout == 'post' %}

<meta property="article:section" content="{{ page.tag | default: 'Journal' }}">
{% endif %}
